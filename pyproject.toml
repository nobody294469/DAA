[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clindoc2fhir"
version = "0.1.0"
description = "AI-Based Multimodal Clinical Document-to-EHR Conversion and Verification"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
    { name = "Clindoc2FHIR Team" }
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "reportlab>=4.0.0",
    "fhir.resources==7.1.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.30.0",
]
ocr = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
clindoc = "clindoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
