[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clindoc2fhir"
version = "0.2.0"
description = "AI-Based Multimodal Clinical Document-to-EHR Conversion and Verification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Clindoc2FHIR Team" }
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "reportlab>=4.0.0",
    "fhir.resources==7.1.0",
    "pymupdf>=1.24",
    "Pillow>=10.1",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "transformers>=4.48,<5",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",         # Google sign-in token check, vLLM judge client
    "itsdangerous>=2.1",   # signed session cookie (Starlette SessionMiddleware)
]
ocr = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "Levenshtein>=0.25",
    "httpx>=0.27",
]

[project.scripts]
clindoc = "clindoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clindoc.web" = ["static/**/*", "data/*.json"]
"clindoc.extract" = ["data/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
