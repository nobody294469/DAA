# ==============================================================================
# ClinDoc Secure vLLM Serving - Nginx TLS Reverse Proxy Configuration
# Phase 8.7 Step 4: Secure Model Serving Infrastructure
#
# Terminates TLS for traffic between AI Gateway / Backend and the internal vLLM node.
# Enforces scrubbing of logs to prevent leakage of clinical prompts or secrets.
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    # Logging configuration: Log only method, URI, status, bytes. Never log request bodies.
    log_format clinical_scrubbed '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log clinical_scrubbed;
    error_log /var/log/nginx/error.log warn;

    # Performance & timeout tuning for LLM streaming / batching
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    upstream vllm_backend {
        server vllm:8000;
        keepalive 32;
    }

    server {
        listen 8443 ssl;
        server_name vllm-internal;

        # Strict TLS Configuration (TLS 1.2 and TLS 1.3 only; disable legacy SSLv3/TLS 1.0/1.1)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!CAMELLIA:!RC4;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Certificate and private key paths (mounted from secret volume)
        ssl_certificate /etc/ssl/certs/server.crt;
        ssl_certificate_key /etc/ssl/certs/server.key;

        # Request payload buffer (JSON prompts)
        client_max_body_size 16M;

        # ----------------------------------------------------------------------
        # Infrastructure Health / Readiness Probe (Lightweight, unauthenticated)
        # Accessible within internal gateway network; performs no inference.
        # ----------------------------------------------------------------------
        location /health {
            proxy_pass http://vllm_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # ----------------------------------------------------------------------
        # Authenticated OpenAI-Compatible API (e.g., /v1/chat/completions)
        # vLLM upstream validates Authorization: Bearer <token>.
        # ----------------------------------------------------------------------
        location /v1/ {
            proxy_pass http://vllm_backend/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Extended timeouts for LLM autoregressive generation (up to 256 tokens)
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Deny all other routes by default
        location / {
            return 404 '{"error": "route_not_found"}';
            add_header Content-Type application/json;
        }
    }

    # --------------------------------------------------------------------------
    # Local health probe listener for Docker container healthcheck
    # --------------------------------------------------------------------------
    server {
        listen 127.0.0.1:8080;
        location /health {
            return 200 'proxy_ready';
            add_header Content-Type text/plain;
        }
    }
}
