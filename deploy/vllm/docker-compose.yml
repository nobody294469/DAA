version: "3.8"

# ==============================================================================
# ClinDoc Secure vLLM Model Serving - Production Reference Manifest
# Phase 8.7 Step 4: Secure Model Serving Infrastructure
#
# Topology:
#   AI Gateway / Application Backend (gateway_network)
#          ↓ TLS (HTTPS port 8443)
#   TLS Termination Reverse Proxy (clindoc-vllm-tls-proxy)
#          ↓ Cleartext HTTP over isolated internal bridge
#   vLLM GPU Host (clindoc-vllm-production, model_serving_internal)
#          ↓ In-memory GPU execution
#   Qwen/Qwen2.5-7B-Instruct-AWQ
#
# Security Invariants:
#   1. Egress Deny: model_serving_internal has `internal: true`. Containers on this
#      network have zero default outbound Internet routing.
#   2. Private Network Boundary: vLLM port 8000 is never exposed on the host or public WAN.
#   3. Authentication: vLLM enforces `--api-key ${VLLM_API_KEY}` on /v1/chat/completions.
#   4. Privacy: `--disable-log-requests` prevents logging prompts/completions containing PHI.
#   5. TLS: Reverse proxy terminates TLS 1.2/1.3 with strict ciphers.
#   6. Model Caching: Volume vllm_cache preserves weights across container restarts.
#   7. Health: /health probe remains distinct from inference and requires no inference calls.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # vLLM Serving Container (Private Network Only, No Egress)
  # ----------------------------------------------------------------------------
  vllm:
    image: vllm/vllm-openai:v0.6.3
    container_name: clindoc-vllm-production
    restart: unless-stopped
    command: >
      serve Qwen/Qwen2.5-7B-Instruct-AWQ
      --quantization awq
      --api-key ${VLLM_API_KEY:?VLLM_API_KEY environment variable is required}
      --disable-log-requests
      --max-model-len 4096
      --host 0.0.0.0
      --port 8000
    environment:
      - VLLM_API_KEY=${VLLM_API_KEY:?VLLM_API_KEY environment variable is required}
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - vllm_cache:/root/.cache/huggingface
      - ./certs:/etc/ssl/vllm:ro
    networks:
      - model_serving_internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ----------------------------------------------------------------------------
  # TLS Termination Reverse Proxy (Bridges Gateway Network & Internal Serving)
  # ----------------------------------------------------------------------------
  tls-proxy:
    image: nginx:1.25-alpine
    container_name: clindoc-vllm-tls-proxy
    restart: unless-stopped
    ports:
      - "${VLLM_TLS_PORT:-8443}:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/ssl/certs:ro
    networks:
      - model_serving_internal
      - gateway_network
    depends_on:
      vllm:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

# ------------------------------------------------------------------------------
# Network Isolation Architecture
# ------------------------------------------------------------------------------
networks:
  # Internal-only network for GPU host: strictly isolated, NO default gateway/egress
  model_serving_internal:
    internal: true
    driver: bridge

  # Ingress network connected to AI Gateway / backend application services
  gateway_network:
    driver: bridge

# ------------------------------------------------------------------------------
# Persistent Volume for Model Weights Cache
# ------------------------------------------------------------------------------
volumes:
  vllm_cache:
    driver: local
